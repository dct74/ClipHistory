name: Release

# Triggers when you push a version tag, e.g.:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build DMG & publish release
    runs-on: macos-14

    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build DMG
        run: bash scripts/build-dmg.sh

      # build-dmg.sh stamps the bundle from UpdateChecker.currentVersion, so a
      # tag that disagrees with the source would ship a build whose in-app
      # updater compares against a different number. Fail instead of patching.
      - name: Check tag matches source version
        run: |
          source_version="$(sed -n 's/.*currentVersion = "\(.*\)"/\1/p' Sources/ClipHistory/UpdateChecker.swift | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=$tag_version  UpdateChecker.currentVersion=$source_version"
          if [ "$tag_version" != "$source_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match UpdateChecker.currentVersion ($source_version)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ClipHistory ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/ClipHistory.dmg
            dist/ClipHistory.dmg.sha256
          generate_release_notes: true   # auto-fills changelog from commits
          fail_on_unmatched_files: true
